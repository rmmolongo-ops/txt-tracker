<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TxT Tracker" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TxT Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" />
    <script>
      /* Apparence choisie dans le profil : appliquée avant le premier affichage (même clé que lib/theme.js). */
      try { var p = localStorage.getItem('txt_theme'); if (p === 'light' || (p === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    </script>
    <style>
      :root { color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="light"] body { background: #f3f5f9; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0e1a; -webkit-tap-highlight-color: transparent; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
      input, button { font-family: inherit; }
      /* Retours d'interaction globaux : les styles en ligne ne peuvent pas porter :hover/:active/:focus-visible. */
      button, [role="button"] { transition: transform .15s ease, filter .15s ease, background-color .15s ease; }
      button:not(:disabled):hover, [role="button"]:hover { filter: brightness(1.12); }
      html[data-theme="light"] button:not(:disabled):hover, html[data-theme="light"] [role="button"]:hover { filter: brightness(.95); }
      button:not(:disabled):active, [role="button"]:active { transform: scale(.98); }
      button:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus, #6ea0f5); outline-offset: 2px; }
      .mono { font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
      @media (prefers-reduced-motion: reduce) { button, [role="button"] { transition: none; } }
      @media print {
        body * { visibility: hidden; }
        #fiche-joueur-print, #fiche-joueur-print * { visibility: visible; }
        #fiche-joueur-print { position: absolute; top: 0; left: 0; width: 100%; max-height: none !important; overflow: visible !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
